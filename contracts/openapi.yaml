                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  next_cursor:
                    anyOf:
                    - *id008
                    - type: 'null'
                required:
                - items
                - next_cursor
      parameters:
      - name: cursor
        in: query
        schema: *id008
      - name: limit
        in: query
