        '422':
          description: Invalid or prohibited content
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aether_session
  schemas:
    AcceptanceCriterion:
      additionalProperties: false
      properties:
        criterion_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Criterion Id
          type: string
        template:
          enum:
          - artifact_exists
          - json_schema
          - trusted_test_suite
          - citation_integrity
          - source_coverage
          - human_review
          title: Template
          type: string
        description:
          maxLength: 2000
          minLength: 1
          title: Description
          type: string
        mandatory:
          default: true
          title: Mandatory
          type: boolean
        parameters:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          title: Parameters
          type: object
        trusted_suite_hash:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          default: null
          title: Trusted Suite Hash
      required:
      - criterion_id
      - template
      - description
      title: AcceptanceCriterion
      type: object
    ApprovalGrant:
      additionalProperties: false
      properties:
        approval_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Approval Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Project Id
          type: string
        task_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Task Id
          type: string
        intent_digest:
          pattern: ^[0-9a-f]{64}$
          title: Intent Digest
          type: string
        issued_to_owner:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Issued To Owner
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        decision:
          enum:
          - approved
          - rejected
          title: Decision
          type: string
      required:
      - approval_id
      - project_id
      - task_id
      - intent_digest
      - issued_to_owner
      - expires_at
      - decision
      title: ApprovalGrant
      type: object
    ArtifactRef:
      additionalProperties: false
      properties:
        artifact_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Artifact Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Project Id
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        byte_size:
          minimum: 0
          title: Byte Size
          type: integer
        media_type:
          title: Media Type
          type: string
        classification:
          default: project_private
          enum:
          - public
          - project_private
          - sensitive
          title: Classification
          type: string
      required:
      - artifact_id
      - project_id
      - sha256
      - byte_size
      - media_type
      title: ArtifactRef
      type: object
    BudgetSpec:
      additionalProperties: false
      properties:
        max_cost_micro_usd:
          default: 2000000
          minimum: 0
          title: Max Cost Micro Usd
          type: integer
        max_tokens:
          default: 100000
          minimum: 1
          title: Max Tokens
          type: integer
        max_model_requests:
          default: 48
          minimum: 1
          title: Max Model Requests
          type: integer
        active_seconds:
          default: 1800
          minimum: 1
          title: Active Seconds
          type: integer
        verification_reserve_fraction:
          default: 0.2
          exclusiveMaximum: 1
          minimum: 0
          title: Verification Reserve Fraction
          type: number
      title: BudgetSpec
      type: object
    Citation:
      additionalProperties: false
