openapi: 3.1.0
info:
  title: AETHER V1 API design contract
  version: 1.0.0
  description: Design contract, not an implemented API. Server-side scope/authentication, side-effect ledgers and
    independent verification are mandatory. Production entity IDs are UUID even when reusable reference schemas
    allow readable fixtures. Stream and generic provider metrics fields are intentionally bounded by their described
    adapters; do not accept arbitrary privileged commands.
servers:
- url: http://127.0.0.1:8000
  description: Intended local development endpoint, not a running server
security:
- sessionCookie: []
paths:
  /health/live:
    get:
      operationId: liveness
      summary: liveness
      responses:
        '401': &id001
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id002
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id003
          description: Invisible or missing resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id004
          description: Idempotency/version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id005
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id006
          description: Rate or budget limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id007
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: readiness
      summary: readiness
      responses:
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '503': *id007
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /v1/auth/bootstrap:
    post:
      operationId: bootstrapOwner
      summary: One-use, loopback-only owner enrollment; disabled after first owner.
      responses:
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '503': *id007
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
  /v1/auth/session:
