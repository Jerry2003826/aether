[project]
name = "aether-openhands-probe"
version = "0.0.0"
description = "Isolated OpenHands compatibility probe. Not the control-plane environment."
requires-python = ">=3.12"
dependencies = [
  "openhands-sdk==1.54.0",
  "openhands-tools==1.54.0",
  "openhands-workspace==1.54.0",
  "openhands-agent-server==1.54.0",
  "func-timeout==4.3.5",
]

[tool.uv]
package = false

[tool.uv.sources]
# 4.3.5 publishes no wheel. This wheel was built from that sdist so installs can use --no-build.
func-timeout = { path = "wheels/func_timeout-4.3.5-py3-none-any.whl" }
