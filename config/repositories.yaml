spec_version: '1.4'
note: Selection registry, NOT an installed or release-validated dependency lock. Unlisted new runtime frameworks require
  an ADR and owner approval.
repositories:
- id: temporal
  repository: temporalio/temporal
  url: https://github.com/temporalio/temporal
  role: core
  reuse: Temporal server，独立数据库/namespace与持久服务
  destination: infra/temporal/
  boundary: 不把开发临时服务当正式持久运行
  selected_version: null
  release_probe_status: not_run
- id: temporal-python
  repository: temporalio/sdk-python
  url: https://github.com/temporalio/sdk-python
  role: core
  reuse: temporalio.workflow/activity/worker/client/testing；Workflow/Activity/重放
  destination: services/worker/aether_worker/
  boundary: Workflow中无网络DB文件I/O
  selected_version: null
  release_probe_status: not_run
- id: fastapi
  repository: fastapi/fastapi
  url: https://github.com/fastapi/fastapi
  role: core
  reuse: API routing/Depends/OpenAPI，认证逻辑属于AETHER
  destination: services/api/aether_api/
  boundary: 不使用BackgroundTasks代替持久任务
  selected_version: null
  release_probe_status: not_run
- id: pydantic
  repository: pydantic/pydantic
  url: https://github.com/pydantic/pydantic
  role: core
  reuse: BaseModel/TypeAdapter/严格输入合同
  destination: packages/domain/aether_domain/
  boundary: 类型校验不等于鉴权或深度不可变
  selected_version: null
  release_probe_status: not_run
- id: sqlalchemy
  repository: sqlalchemy/sqlalchemy
  url: https://github.com/sqlalchemy/sqlalchemy
  role: core
  reuse: session/transaction/query与runtime角色
  destination: packages/storage/aether_storage/
  boundary: 不用superuser连接做应用运行
  selected_version: null
  release_probe_status: not_run
- id: alembic
  repository: sqlalchemy/alembic
  url: https://github.com/sqlalchemy/alembic
  role: core
  reuse: 增量迁移与升级路径
  destination: migrations/
  boundary: 不通过删库解决schema冲突
  selected_version: null
  release_probe_status: not_run
- id: litellm
  repository: BerriAI/litellm
  url: https://github.com/BerriAI/litellm
  role: core
  reuse: Python completion/acompletion provider adapter，实际能力探针
  destination: services/gateway/aether_gateway/providers/
  boundary: 不启用agent harness/MCP/独立预算权威；外层含SSRF出口限制
  selected_version: null
  release_probe_status: not_run
- id: openhands
  repository: OpenHands/software-agent-sdk
  url: https://github.com/OpenHands/software-agent-sdk
  role: core
  reuse: openhands-sdk/tools/workspace/agent-server四包；LLM/Agent/Conversation/FileEditorTool/TerminalTool/隔离workspace
  destination: packages/adapters/aether_adapters/openhands.py
  boundary: 只做有界job；选中release验证配置/生命周期，不能从README推断恢复和隔离自动成立
  selected_version: null
  release_probe_status: not_run
- id: pgvector
  repository: pgvector/pgvector
  url: https://github.com/pgvector/pgvector
  role: core
  reuse: 向量类型、cosine距离；小语料先精确召回
  destination: packages/knowledge/aether_knowledge/vector.py
  boundary: 不用ANN速度掩盖授权过滤后的召回下降
  selected_version: null
  release_probe_status: not_run
- id: pgvector-python
  repository: pgvector/pgvector-python
  url: https://github.com/pgvector/pgvector-python
  role: core
  reuse: SQLAlchemy类型绑定
  destination: packages/knowledge/aether_knowledge/vector.py
  boundary: 维数/revision写入metadata
  selected_version: null
  release_probe_status: not_run
- id: bm25s
  repository: xhluca/bm25s
  url: https://github.com/xhluca/bm25s
  role: core
  reuse: BM25索引、retrieve、save/load；冻结分词词表
  destination: packages/knowledge/aether_knowledge/lexical.py
  boundary: 项目级不可变generation+原子切换；不是事务增量引擎
  selected_version: null
  release_probe_status: not_run
- id: jieba
  repository: fxsjy/jieba
  url: https://github.com/fxsjy/jieba
  role: core
  reuse: 中文词切分与冻结词典
  destination: packages/knowledge/aether_knowledge/tokenize.py
  boundary: 不能把token offset当引用原文offset
  selected_version: null
  release_probe_status: not_run
- id: flagembedding
  repository: FlagOpen/FlagEmbedding
  url: https://github.com/FlagOpen/FlagEmbedding
  role: core
  reuse: BGE-M3 embedding、bge-reranker-v2-m3 re-rank，单独ML环境
  destination: services/ml/aether_ml/
  boundary: 模型权重revision与许可单独锁；CPU/GPU按实测
  selected_version: null
  release_probe_status: not_run
- id: httpx
  repository: encode/httpx
  url: https://github.com/encode/httpx
  role: core
  reuse: 受控HTTP客户端/timeout/stream读取
  destination: packages/adapters/aether_adapters/http_fetch.py
  boundary: 自写目标授权/DNS连接绑定/限流；不用trust_env绕过出口
  selected_version: null
  release_probe_status: not_run
- id: trafilatura
  repository: adbar/trafilatura
  url: https://github.com/adbar/trafilatura
  role: core
  reuse: HTML正文抽取
  destination: services/ml/aether_ml/parsers/
  boundary: 下载在网关完成；不让解析库自由抓站
  selected_version: null
  release_probe_status: not_run
- id: feedparser
  repository: kurtmckee/feedparser
  url: https://github.com/kurtmckee/feedparser
  role: core
  reuse: parse已下载RSS/Atom
  destination: services/ml/aether_ml/parsers/
  boundary: 先限制网络/大小再解析
  selected_version: null
  release_probe_status: not_run
- id: docling
  repository: docling-project/docling
  url: https://github.com/docling-project/docling
  role: core
  reuse: 本地文档转换器/结构化文本
  destination: services/ml/aether_ml/parsers/
  boundary: parser隔离，扫描件OCR需显式启用
  selected_version: null
  release_probe_status: not_run
- id: playwright
  repository: microsoft/playwright-python
  url: https://github.com/microsoft/playwright-python
  role: core
  reuse: browser/context/page与固定浏览器版本
  destination: packages/adapters/aether_adapters/browser.py
  boundary: JS fallback不是自由browse；工具profile默认off
  selected_version: null
  release_probe_status: not_run
- id: mcp
  repository: modelcontextprotocol/python-sdk
  url: https://github.com/modelcontextprotocol/python-sdk
  role: core
  reuse: 官方client/session/stdio或Streamable HTTP transport
  destination: packages/adapters/aether_adapters/mcp.py
  boundary: 固定server/schema并本地分类授权，不自动发现安装
  selected_version: null
  release_probe_status: not_run
- id: skills
  repository: agentskills/agentskills
  url: https://github.com/agentskills/agentskills
  role: core_spec
  reuse: SKILL.md格式与渐进披露规范
  destination: packages/skills/aether_skills/
  boundary: 格式复用，不下载整个公开技能库
  selected_version: null
  release_probe_status: not_run
- id: nextjs
  repository: vercel/next.js
  url: https://github.com/vercel/next.js
  role: core
  reuse: Next.js/React/TypeScript工作台
  destination: apps/web/
  boundary: 不让前端直连model/runner/Temporal admin
  selected_version: null
  release_probe_status: not_run
- id: shadcn
  repository: shadcn-ui/ui
  url: https://github.com/shadcn-ui/ui
  role: core_ui
  reuse: 仅选所需基础组件
  destination: apps/web/src/components/
  boundary: 不一键引入整套无用页面
  selected_version: null
  release_probe_status: not_run
- id: evals
  repository: pydantic/pydantic-ai
  url: https://github.com/pydantic/pydantic-ai
  role: dev
  reuse: 仅独立pydantic-evals：Dataset/Case/evaluator，按所选release实测
  destination: packages/evaluation/aether_evaluation/
  boundary: 不引入Pydantic AI Agent运行时替代Temporal
  selected_version: null
  release_probe_status: not_run
- id: syft
  repository: anchore/syft
  url: https://github.com/anchore/syft
  role: dev_release
  reuse: CLI扫描实际镜像/文件系统产SBOM
  destination: scripts/supply_chain/
  boundary: SBOM是清单不是无漏洞证明
  selected_version: null
  release_probe_status: not_run
- id: osv
  repository: google/osv-scanner
  url: https://github.com/google/osv-scanner
  role: dev_release
  reuse: CLI依赖漏洞扫描；优先支持的本地数据库/离线模式
  destination: scripts/supply_chain/
  boundary: 不是Google搜索/云runtime依赖；网络查询/隐私要明确，库更新后离线扫
  selected_version: null
  release_probe_status: not_run
- id: codegraph
  repository: colbymchenry/codegraph
  url: https://github.com/colbymchenry/codegraph
  role: selected_optional
  reuse: 固定CLI/MCP codegraph_explore，impact/affected由适配器按需调用
  destination: packages/adapters/aether_adapters/codegraph.py
  boundary: 本地索引有遥测开关；任意projectPath不透传；snapshot级权限
  selected_version: null
  release_probe_status: not_run
- id: hermes
  repository: NousResearch/hermes-agent
  url: https://github.com/NousResearch/hermes-agent
  role: baseline_only
  reuse: 固定release独立CLI/环境，cold与learned基线
  destination: packages/evaluation/aether_evaluation/baselines/
  boundary: 不是生产依赖或第二调度器；没有实测不写排名
  selected_version: null
  release_probe_status: not_run
