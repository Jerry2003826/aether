# Development dependency services. Temporal here is `server start-dev`.
# That process is not release persistence and must not be described as a durable production server.
name: aether
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${AETHER_POSTGRES_USER:?set AETHER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AETHER_POSTGRES_PASSWORD:?set AETHER_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aether_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--headless", "--log-format", "json"]
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  aether_pg:
