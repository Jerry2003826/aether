[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "1.4.0"
description = "AETHER V1.4 local control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "temporalio>=1.9",
  "httpx>=0.28",
  "pyyaml>=6,<7",
  "argon2-cffi>=23",
  "python-multipart>=0.0.18",
  "litellm>=1.55",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["packages/domain", "packages/storage", "services/api", "services/gateway", "services/worker"]
include = ["aether_*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/domain", "packages/storage", "services/api", "services/gateway", "services/worker"]
testpaths = ["tests/unit", "tests/integration"]

[tool.uv]
package = true
