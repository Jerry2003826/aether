[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "1.4.0"
description = "AETHER V1.4 local control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "temporalio>=1.9",
  "httpx>=0.28",
  "pyyaml>=6,<7",
  "argon2-cffi>=23",
  "python-multipart>=0.0.18",
  "litellm>=1.55",
  "defusedxml>=0.7.1",
  "bm25s>=0.2.0",
  "mcp>=1.0",
  "feedparser==6.0.14",
  "trafilatura==2.3.1",
  "docling-slim[format-pdf,format-office]==2.140.0",
  "python-frontmatter==1.3.0",
  "tenacity==9.2.1",
  "langchain-text-splitters==1.1.3",
  "jieba==0.42.1",
  "pydantic-settings==2.16.0",
  "pydantic-evals==2.57.0",
  "detect-secrets==1.5.0",
  "docker==7.2.0",
  "psutil==7.2.2",
  "ir-measures==0.4.3",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "cachetools==6.2.1",
  "pgvector==0.5.1",
]

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["packages/domain", "packages/storage", "services/api", "services/gateway", "services/worker"]
include = ["aether_*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/domain", "packages/storage", "services/api", "services/gateway", "services/worker"]
testpaths = ["tests/unit", "tests/integration"]

[tool.uv]
package = true

[tool.uv.sources]
jieba = { path = "third_party/wheels/jieba-0.42.1-py3-none-any.whl" }
